# ═══════════════════════════════════════════════════════════════
# BLOQUE 1 · RECOMPOSICIÓN — 4 SEMANAS (Luciano)
# ═══════════════════════════════════════════════════════════════
# Sucesor del Bloque Reconstrucción (agosto 2026). Inicio: 31/08/2026.
# Es el bloque 1 de 4 hasta el verano; se reevalúa cada 4 semanas.
#
# QUÉ CAMBIA RESPECTO A RECONSTRUCCIÓN
#   · Rodilla liberada: front squat pasa de 40-47,5 kg a 60-65 kg.
#   · Zona 2 sube de 1 a 2 sesiones semanales (era el punto que se caía).
#   · Los WODs entran al plan con presupuesto: máx 3/semana, nunca en día Z2.
#   · Trabajo dirigido a la asimetría del isquiotibial izquierdo (injerto de
#     semitendinoso): serie extra del lado izquierdo en curl femoral.
#
# HOMBRO — confirmado por el atleta (31/08/2026):
#   · SIN molestia: dragon flag, ab roll-out, kb dead bug pullover, overhead kb
#     carry, overhead walk, landmine press, wall climb, kipping.
#   · Límite: face pull SOLO con tensión muy baja (con más tensión pincha).
#   · Borderline, fuera por ahora: One Arm OH Kb Sit up.
#   · Sigue prohibido: press de hombro y variantes, vuelos laterales, press
#     banca, fondos, ring dips, muscle-ups.
#
# ── SISTEMA DE DOS NIVELES ─────────────────────────────────────
#   Piso innegociable → FA · PACING · FB
#   Capa opcional     → AERO (2ª zona 2) · WOD (pieza principal)
#
#   3 días → [FA, PACING, FB]             semana mala, cubre lo esencial
#   4 días → [FA, AERO, PACING, FB]       ← default (promedio real de agosto)
#   5 días → [FA, AERO, PACING, FB, WOD]  semana buena, sesiones ≤ 1:15
#
# ORDEN: AERO va SEGUNDO a propósito. La 2ª sesión de la semana cae en martes el
# 90% de las semanas, y los martes son largos: ahí va la sesión más corta del
# bloque (~35-45 min contra ~70-75 de las de fuerza). Como AERO es además la
# primera que se cae si falta tiempo, sacarla de la variante de 4 deja exactamente
# [FA, PACING, FB], que es la de 3: la semana colapsa sin desordenarse.
#
# FA y FB funcionan como COLA ROTATIVA: si una semana solo salen 3 sesiones,
# se hacen las dos de fuerza que siguen en el orden. No se pierde ningún patrón.
#
# NOTA: no se usa `mover_a_e` / `header_e` en este bloque. Las sesiones no se
# acortan al sumar días — se agregan días, no se reparte la misma carga.
# ═══════════════════════════════════════════════════════════════

meta:
  nombre: "Bloque 1 · Recomposición"
  atleta: "Luciano"
  tema: "arena"
  total_semanas: 4
  semana_deload: 4
  nota_global: "Prioridad 1: pérdida de grasa — la Zona 2 no se negocia · Rodilla izq y hombro der: dolor = cero · Unilateral: siempre empezá por la IZQUIERDA; la derecha iguala sus reps · Máx 3 WODs/semana, ninguno en día de Zona 2 · Impacto: box jumps O dobles, nunca los dos en volumen alto · Sesión ≤ 1:15 (si falta tiempo se recorta el finisher, nunca el trabajo unilateral)."
  fases:
    - "Base"
    - "Progresión 1"
    - "Progresión 2"
    - "Descarga (deload)"

dias:

  # ─────────────────────────────────────────────────────────────
  # F1 — FUERZA: cadera / rodilla + tríceps        [piso innegociable]
  # ─────────────────────────────────────────────────────────────
  FA:
    titulo: "FUERZA A"
    subtitulo: "Cadera / Rodilla + Tríceps"
    duracion: "~70-75 min"
    secciones:
      - header: "CALENTAMIENTO · rodilla y cadera"
        items:
          - "Bici o remo suave — 5 min"
          - "Abducción de cadera acostado de lado con banda (tobillos) — 2×15/lado · empezá por IZQ · tensión baja"
          - "Glute bridge con banda sobre rodillas (empujá rodillas afuera) — 2×15 · pausa 1s arriba"
          - "Caminata lateral / monster walk con banda — 2×10 pasos/lado · empezá por IZQ"
          - "TKE con banda — 2×15/lado · tensión baja-moderada"
          - "Movilidad tobillo contra pared — 1 min/lado"
          - "Dead bug — 2×10/lado"

      - header: "ISOMETRÍA · tendón rotuliano"
        items:
          - "No se saltea. Es lo que mantuvo la rodilla sin dolor las 4 semanas anteriores."
        ejercicios:
          - nombre: "Wall sit (~60°)"
            nota: "desc 60s · rango sin dolor"
            semanas: ["3×45s", "3×50s", "4×45s", "2×40s (deload)"]

      - header: "A · FUERZA — patrón sentadilla"
        ejercicios:
          - nombre: "Front squat"
            nota: "3s bajando · RPE 7 · desc 2:00"
            semanas: ["60 kg · 4×6", "62,5 kg · 4×6", "65 kg · 5×5", "50 kg · 3×5 (deload)"]

      - header: "B · BISAGRA + ISQUIOTIBIAL — superserie"
        items:
          - "Superserie: hip thrust → curl femoral IZQ → curl femoral DER → desc 1:30"
        ejercicios:
          - nombre: "Hip thrust"
            nota: "2s pausa arriba · RPE 7"
            semanas: ["65 kg · 3×10", "70 kg · 3×10", "75 kg · 3×8", "60 kg · 2×10"]
          - nombre: "Curl femoral unilateral"
            nota: "3s excéntrico · IZQ primero · serie extra IZQ"
            semanas:
              - "3 ladrillos · IZQ 4×8 / DER 3×8"
              - "3 ladrillos · IZQ 4×9 / DER 3×9"
              - "3 ladrillos · IZQ 4×10 / DER 3×10"
              - "2-3 ladrillos · IZQ 3×8 / DER 2×8"

      - header: "C · UNILATERAL + TRÍCEPS — superserie"
        items:
          - "Superserie: step-up IZQ → step-up DER → pushdown → desc 1:00"
        ejercicios:
          - nombre: "Step-up lateral (cajón 40 cm · db)"
            nota: "IZQ primero · bajá 2-3s"
            semanas: ["12,5 kg · 3×8/pierna", "12,5 kg · 3×10", "15 kg · 3×10 *", "10 kg · 2×8"]
          - nombre: "Tríceps pushdown (polea)"
            semanas: ["25 kg · 3×12", "27,5 kg · 3×12", "30 kg · 3×12", "25 kg · 2×12"]
          - nombre: "Tríceps tras nuca (polea)"
            nota: "si pincha el hombro, cambiar por pushdown a una mano"
            semanas: ["15 kg · 3×12", "17,5 kg · 3×12", "20 kg · 3×12", "15 kg · 2×12"]

      - header: "D · CORE — antirrotación y cadena lateral"
        items:
          - "Superserie: Pallof IZQ → Pallof DER → plancha lateral IZQ → DER → desc 1:00"
          - "Sostiene la pelvis en todo el trabajo unilateral del día. Si el tronco no controla, la rodilla izq absorbe el desvío."
        ejercicios:
          - nombre: "Pallof press en polea (de rodillas)"
            nota: "IZQ primero · buscá carga que cueste de verdad, no la mínima"
            semanas: ["3×10/lado", "3×10/lado · +2,5 kg", "3×12/lado · +5 kg vs S1", "2×10/lado · liviano"]
          - nombre: "Plancha lateral con elevación de pierna"
            nota: "IZQ primero · cadera alta, sin caer"
            semanas: ["3×20s/lado", "3×25s/lado", "3×25s/lado + disco 5 kg", "2×20s/lado"]

      - header: "FINISHER · WOD corto"
        items:
          - "6-10 min · ritmo sostenido, NO a fondo (terminás pudiendo hablar de a frases cortas)"
          - "Evitar: sentadilla y bisagra con carga (ya se trabajaron hoy)"
          - "Sí: remo · ski · assault · wall balls · burpees · kettlebell swing · farmer carry · front rack carry · overhead kb carry"
          - "Impacto: hasta 60 box jumps O hasta 200 dobles. Nunca los dos en volumen alto."
          - "WOD elegido: ______________________________"

      - header: "NOTAS DEL DÍA"
        items:
          - "* Step-up S3: pasar a 15 kg SOLO cuando la izquierda iguale a la derecha."
          - "El curl femoral es el ejercicio clave del bloque: la serie extra IZQ compensa el injerto de semitendinoso. El objetivo es reducir la brecha, no igualarla."
          - "En el front squat el tempo protege la rodilla, no la carga baja. Si se acelera la bajada, bajá el peso."
          - "Los únicos gestos por encima de la cabeza del plan son el tríceps tras nuca y los carries overhead del finisher. Se mantienen porque los confirmaste sin molestia (31/08/2026)."
          - "Registrar: carga usada · reps IZQ en curl femoral · sensación rodilla/hombro."

  # ─────────────────────────────────────────────────────────────
  # Z2 — ZONA 2 aeróbica                            [piso innegociable]
  # ─────────────────────────────────────────────────────────────
  PACING:
    titulo: "PACING"
    subtitulo: "Zona 2 en assault bike · RPM de referencia"
    duracion: "~60-75 min"
    secciones:
      - header: "CALENTAMIENTO · prehab"
        items:
          - "Máquina muy suave, progresivo — 6 min"
          - "Abducción de cadera con banda — 2×15/lado · empezá por IZQ"
          - "Caminata lateral / monster walk con banda — 2×10 pasos/lado"
          - "Rotación externa con banda a 0° — 2×15/lado · tensión baja"
          - "Band pull-apart — 2×15"

      - header: "ZONA 2 · trabajo continuo"
        ejercicios:
          - nombre: "Duración efectiva"
            semanas: ["45 min", "50 min", "55-60 min", "40 min (descarga)"]
          - nombre: "Pulsaciones objetivo"
            semanas: ["120-130 ppm", "120-130 ppm", "120-130 ppm", "115-125 ppm"]
          - nombre: "Máquina"
            nota: "SIEMPRE assault bike — este día es el ancla del pacing"
            semanas: ["Assault bike", "Assault bike", "Assault bike", "Assault bike"]
          - nombre: "RPM de referencia"
            nota: "manda el pulso, NO los RPM · el RPM es la métrica que se anota, no el objetivo a forzar"
            semanas: ["~45 RPM (base)", "~45-46 RPM", "~46-47 RPM", "~43-44 RPM"]

      - header: "REGLAS"
        items:
          - "Tu Zona 2 (33 años, FCmáx ~185): 111-130 ppm. Apuntá a 120-130."
          - "Las pulsaciones mandan, NO los RPM. Si a 45 RPM estás en 135, bajá; si estás en 110, subí."
          - "Test de conversación: tenés que poder hablar de corrido."
          - "SIN WOD este día, ni antes ni después. Con intensidad deja de ser Zona 2."
          - "Por qué siempre assault: este día tiene DOS objetivos. Grasa/aeróbico y mejorar el pacing en la assault. Si rotás la máquina acá, perdés la referencia de RPM. La variedad va en el día AERÓBICO."
          - "Anotá RPM y pulsaciones cada semana. Si sostenés más RPM al mismo pulso, mejoraste. Ese es el progreso, no la duración."

      - header: "CIERRE · prehab"
        items:
          - "Vuelta a la calma en máquina — 5 min"
          - "Face pull con banda — 2×20 · TENSIÓN MUY BAJA, no subir"
          - "Serrato punch con banda — 2×12 · te sienta bien, se puede progresar tensión"
          - "TKE con banda — 2×15/lado"
          - "Movilidad de cadera y hombro — 3 min"

  # ─────────────────────────────────────────────────────────────
  # F2 — FUERZA: tracción / gimnásticos + bíceps    [piso innegociable]
  # ─────────────────────────────────────────────────────────────
  FB:
    titulo: "FUERZA B"
    subtitulo: "Tracción / Gimnásticos + Bíceps"
    duracion: "~70-75 min"
    secciones:
      - header: "CALENTAMIENTO · manguito rotador"
        items:
          - "Remo o ski suave — 5 min"
          - "Reverse fly inclinado (mancuernas livianas) — 2×20"
          - "Rotación externa con banda a 0° (toalla bajo el codo) — 2×15/lado · tensión baja"
          - "Face pull con banda — 2×20 · TENSIÓN MUY BAJA, no subir (con más tensión te pincha el hombro)"
          - "Band pull-apart (palmas arriba) — 2×15"
          - "Serrato punch con banda — 2×12 · te sienta bien, se puede progresar tensión"
          - "Prone IYT — 2×5 c/letra · sin peso"
          - "Colgado activo en barra, escápulas abajo — 3×15s"

      - header: "A · SKILL — camino a C2B"
        items:
          - "Prep: wall climb — 3 subidas controladas"
          - "Esto NO es acondicionamiento: calidad por encima de todo, NUNCA al fallo."
          - "Descanso 45s · si la última serie se rompe, bajá a series de 2."
        ejercicios:
          - nombre: "Skill"
            semanas:
              - "8×3 kipping pull-up (foco arco/hollow)"
              - "8×3 C2B"
              - "6×4 C2B"
              - "5×3 C2B suave"

      - header: "B · TRACCIÓN + BISAGRA UNILATERAL — superserie"
        items:
          - "Superserie: dominadas → RDL IZQ → RDL DER → desc 1:45"
        ejercicios:
          - nombre: "Dominada estricta"
            nota: "2s bajando · dejar 3-4 reps en reserva"
            semanas: ["4×6", "4×7", "4×8", "3×5"]
          - nombre: "RDL unilateral con mancuernas"
            nota: "IZQ primero · 3s bajando"
            semanas: ["2×12,5 kg · 3×10/pierna", "2×15 kg · 3×10", "2×17,5 kg · 3×8", "2×12,5 kg · 2×10"]

      - header: "C · EMPUJE SEGURO + BÍCEPS — superserie"
        items:
          - "Superserie: landmine press → curl W → desc 1:15"
        ejercicios:
          - nombre: "Landmine press"
            nota: "si algún día pincha el hombro, se saca"
            semanas: ["15 kg · 3×8/brazo", "17,5 kg · 3×8", "20 kg · 3×8", "15 kg · 2×8"]
          - nombre: "Curl bíceps barra W"
            nota: "2s bajando"
            semanas: ["10 kg/lado · 3×10", "11,5 kg · 3×10", "12,5 kg · 3×10", "10 kg · 2×10"]

      - header: "D · CORE GIMNÁSTICO + BÍCEPS — superserie"
        items:
          - "Superserie: T2B → curl martillo → desc 1:00"
        ejercicios:
          - nombre: "Toes to bar"
            nota: "controlado, sin fallo"
            semanas: ["5×5", "5×6", "4×8 kipping", "3×5"]
          - nombre: "Curl martillo"
            nota: "2s bajando"
            semanas: ["10 kg · 3×10", "11,5 kg · 3×10", "12,5 kg · 3×10", "10 kg · 2×10"]

      - header: "E · CORE — compresión y posiciones de kipping"
        items:
          - "Superserie: dragon flag → plank pull through → desc 1:30"
          - "El dragon flag es control excéntrico de la línea hollow bajo carga: entrena directo hacia tus C2B y T2B."
          - "Escala si se rompe la bajada: rodillas flexionadas (tuck dragon flag) antes que acortar el tiempo."
          - "Objetivo del bloque: llegar a 1 dragon flag completo en la S4."
        ejercicios:
          - nombre: "Dragon flag negativo"
            nota: "agarre firme atrás de la cabeza · bajada controlada, lumbar sin despegarse · confirmado sin molestia de hombro"
            semanas:
              - "3×5 · bajada 5s"
              - "3×6 · bajada 5s"
              - "3×6 · bajada 6-7s + 1 intento completo"
              - "2×4 · bajada 4s (deload)"
          - nombre: "Plank pull through con mancuerna"
            nota: "empezá arrastrando hacia la IZQ · cadera quieta, sin rotar"
            semanas: ["3×10/lado · 10 kg", "3×12/lado · 10 kg", "3×12/lado · 12,5-15 kg", "2×10/lado · liviano"]

      - header: "FINISHER · WOD corto"
        items:
          - "6-10 min · ritmo sostenido, NO a fondo"
          - "Evitar: volumen alto de tracción (nada de WODs con 50+ pull-ups o C2B)"
          - "Sí: wall balls · estocadas caminando · remo · assault · kettlebell · trineo (10 m) · carries (incluido overhead)"
          - "Sin press por encima de la cabeza en ninguna variante."
          - "WOD elegido: ______________________________"

      - header: "CIERRE · manguito"
        items:
          - "Rotación externa en polea — 1×20/lado · liviano, sin buscar carga"

      - header: "NOTAS DEL DÍA"
        items:
          - "Dominadas a 4×6 con 10 de máximo es deliberado: el skill de C2B necesita hombro y agarre disponibles."
          - "Registrar: cuántas C2B seguidas salieron limpias · sensación del hombro al día siguiente."

  # ─────────────────────────────────────────────────────────────
  # AERO — segunda Zona 2        [opcional · va 2º: es el día corto]
  # Sin `solo_en_variante`: aparece en las variantes de 4 y de 5 días.
  # Es la primera sesión que se cae si la semana viene corta.
  # ─────────────────────────────────────────────────────────────
  AERO:
    titulo: "AERÓBICO"
    subtitulo: "Zona 2 · máquina rotativa o mixto — OPCIONAL"
    duracion: "~35-45 min"
    secciones:
      - header: "CALENTAMIENTO"
        items:
          - "Máquina muy suave, progresivo — 5 min"

      - header: "ZONA 2 · trabajo continuo"
        ejercicios:
          - nombre: "Duración efectiva"
            semanas: ["35 min", "40 min", "45 min", "30 min (descarga)"]
          - nombre: "Pulsaciones objetivo"
            semanas: ["120-130 ppm", "120-130 ppm", "120-130 ppm", "115-125 ppm"]
          - nombre: "Máquina"
            nota: "acá SÍ rota — es el día de la variedad, para no aburrirte"
            semanas: ["Remo", "Ski", "Remo + ski", "Libre"]

      - header: "SESIÓN SUGERIDA · del catálogo de zona 2"
        generador: "z2"
        items:
          - "ELEGÍ UNA: o el bloque de máquina de arriba, o esta sesión. No se suman ni se encadenan."
          - "Si hacés esta, manda SU duración, no la de arriba. Sale automático de data/z2_catalog.yaml."

      - header: "FORMATO ALTERNATIVO · zona 2 mixta"
        items:
          - "En vez de máquina, se puede hacer un circuito mixto EN ZONA 2. Solo acá; el día PACING va siempre en assault."
          - "Gobierno: respiración nasal con la boca cerrada. Si se te abren las fosas, bajá el ritmo."
          - "Techo duro 130 ppm. Si pasás de 135, parás y caminás hasta volver a 125."
          - "Cargas MUY livianas, reps lentas y deliberadas, nunca cerca del fallo. No es un WOD suave: es zona 2 con objetos."
          - "Formato sugerido: bloques de 10 min de trabajo + 3-5 min de máquina suave (relación 1:0,5)."
          - "Movimientos OK: wall balls livianos · kettlebell swing ruso liviano · farmer carry · remo/ski/assault · step-ups sin peso · sentadilla al aire · empuje de trineo liviano."
          - "FUERA: nada por encima de la cabeza · sin saltos ni dobles · sin trabajo limitado por agarre · sin estocadas cargadas (fatiga local = deriva de pulso)."

      - header: "REGLAS"
        items:
          - "Mismas reglas que PACING: manda el pulso, sin WOD ese día."
          - "Si la semana viene corta, esta es la primera sesión que se cae — nunca el día PACING."

      - header: "CIERRE"
        items:
          - "Vuelta a la calma — 5 min · movilidad"

  # ─────────────────────────────────────────────────────────────
  # W — WOD como pieza principal               [opcional · 5ª sesión]
  # ─────────────────────────────────────────────────────────────
  WOD:
    titulo: "WOD"
    subtitulo: "Pieza principal — OPCIONAL, solo con 5 sesiones"
    duracion: "~50-60 min"
    solo_en_variante: 5
    secciones:
      - header: "CALENTAMIENTO · prehab + específico"
        items:
          - "Máquina suave — 5 min"
          - "Abducción de cadera con banda — 2×15/lado · empezá por IZQ"
          - "TKE con banda — 2×15/lado"
          - "Rotación externa con banda a 0° — 2×15/lado"
          - "Band pull-apart — 2×15"
          - "Progresivo con los patrones específicos del WOD — 5-8 min"

      - header: "WOD"
        items:
          - "Elegido por vos según los patrones ya cargados en la semana."
          - "WOD elegido: ______________________________"
        ejercicios:
          - nombre: "Duración objetivo"
            nota: "ritmo sostenido, no competitivo"
            semanas: ["15-20 min", "15-20 min", "15-20 min", "10-12 min (descarga)"]

      - header: "FILTROS DE MOVIMIENTO"
        items:
          - "PROHIBIDO por hombro: press de hombro y variantes (push press, jerk, thruster), vuelos laterales, press banca, fondos, ring dips, muscle-ups."
          - "PROHIBIDO por rodilla: pistols."
          - "LIMITADO: hasta 60 box jumps O hasta 200 dobles por WOD. Si hay volumen alto de uno, el siguiente WOD con impacto va 48 h después."
          - "LIBRE: wall balls · estocadas · burpees · kettlebell · remo/ski/assault · trineo · cargadas."
          - "Ninguno a fondo durante este bloque: el estímulo intenso ya lo dan las sesiones de fuerza."

      - header: "CIERRE"
        items:
          - "Máquina suave en zona 1-2 — 10 min + movilidad cadera y hombro"

# ═══════════════════════════════════════════════════════════════
# VARIANTES — qué días salen según cuántos se entrene por semana
# ═══════════════════════════════════════════════════════════════
variantes:
  3:
    dias: [FA, PACING, FB]
    descripcion: "Piso innegociable · Fuerza · Zona 2 · Fuerza (2 WODs como finisher)"
  4:
    dias: [FA, AERO, PACING, FB]
    descripcion: "Piso + 2ª Zona 2 (2 WODs como finisher)"
  5:
    dias: [FA, AERO, PACING, FB, WOD]
    descripcion: "Semana completa · 2 Zona 2 + 3 WODs (2 finisher + 1 principal)"

variante_default: 4
