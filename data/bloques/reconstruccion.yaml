# ═══════════════════════════════════════════════════════════════
# BLOQUE RECONSTRUCCIÓN — 4 SEMANAS (Luciano)
# ═══════════════════════════════════════════════════════════════
# Fuente de datos:
#   - Esqueleto_Bloque_Reconstruccion.xlsx  → cargas/reps por semana (S1→S4)
#   - Plan_Entrenamiento_Agosto.xlsx (Semana 1) → layout completo del día
#
# Lógica: S1 base → S2-S3 suben carga/reps → S4 descarga (deload).
# Cargas orientativas (±2,5 kg según sensaciones · RPE 6-8, nunca al fallo).
#
# Estructura de cada día:
#   secciones: lista ordenada de bloques.
#     - header: título del bloque (CALENTAMIENTO, FUERZA, CORE, ...)
#       items:      líneas fijas (iguales todas las semanas)
#       ejercicios: líneas que cambian por semana
#         - nombre: nombre del ejercicio
#           nota:   cue técnico fijo (se agrega en todas las semanas)  [opcional]
#           semanas: [S1, S2, S3, S4]  ← carga/esquema por semana
#
# ── VARIANTES DE DÍAS (3 / 4 / 5) ──────────────────────────────
# Al final del archivo, el bloque `variantes:` define qué días salen según
# cuántos días por semana se entrenen. La variante 4 es el comportamiento
# histórico y no cambia nunca.
#
#   3 días → [AD, B, C]       AD = día lower fusionado (se COMPONE de A y D)
#   4 días → [A, B, C, D]     ← igual que siempre
#   5 días → [A, B, C, D, E]  sesiones cortas (~55 min) + día de accesorios
#
# Marcas que SOLO se activan en la variante 5 (`aplicar_mover_a_e: true`):
#   mover_a_e: true   → esta sección (o este ejercicio suelto) se muda al DÍA E
#   header_e: "..."   → bajo qué header cae en el Día E (default: su header).
#                       Dos secciones con el mismo header_e se FUSIONAN allá.
#
# Composición del día AD (variante 3) — no se repiten cargas, se referencian:
#   componer:
#     - dia: A                     ← copia una sección entera de otro día
#       seccion: "CALENTAMIENTO"
#       header: "..."              [opcional] renombra el header
#       agregar_items: [...]       [opcional] líneas fijas extra al final
#       excluir: ["Ejercicio X"]   [opcional] saca ejercicios por nombre
#     - header: "SECCIÓN NUEVA"    ← arma una sección juntando sueltos
#       items: [...]               [opcional]
#       tomar:
#         - {dia: D, ejercicio: "Step-up lateral (cajón 20-25 cm · db)"}
# ═══════════════════════════════════════════════════════════════

meta:
  nombre: "Bloque Reconstrucción"
  atleta: "Luciano"
  tema: "arena"
  total_semanas: 4
  semana_deload: 4
  nota_global: "Rodilla izq (operada + artrosis): emparejar antes de cargar · arrancá las series por la izquierda · «sin dolor» manda · sin impacto."
  fases:
    - "Base"
    - "Progresión 1"
    - "Progresión 2"
    - "Descarga (deload)"

dias:

  # ─────────────────────────────────────────────────────────────
  A:
    titulo: "DÍA A"
    subtitulo: "LOWER · Glúteo/Femoral + rodilla"
    duracion: "~75 min"
    duracion_5: "~55 min"
    secciones:
      - header: "CALENTAMIENTO"
        items:
          - "Bici suave — 4 min"
          - "Abducción cadera acostado de lado con banda (tobillos) — 2×15/lado · tensión baja"
          - "Glute bridge con banda sobre rodillas (empujá rodillas afuera) — 2×15 · pausa 1s arriba · tensión baja-moderada"
          - "Caminata lateral / monster walk con banda — 2×10 pasos/lado · empezá por izq · tensión baja-moderada"
          - "TKE con banda — 2×15/lado · tensión baja-moderada"
          - "Dead bug — 2×10/lado"

      - header: "ISOMETRÍA · tendón rotuliano"
        ejercicios:
          - nombre: "Wall sit (~60°)"
            nota: "desc 60s"
            semanas: ["5×40s", "5×45s", "5×50s", "4×40s (deload)"]

      - header: "FUERZA · bisagra de cadera"
        ejercicios:
          - nombre: "Hip thrust"
            nota: "2s pausa · RPE 7 · igualar/superar"
            semanas: ["60 kg · 3×12", "62,5 kg · 3×12", "65 kg · 3×10-12", "60 kg · 3×10"]
          - nombre: "RDL con barra"
            nota: "3s bajando · RPE 6-7 · completar las reps limpias"
            semanas: ["50-52,5 kg · 3×10", "55 kg · 3×10", "57,5 kg · 3×8-10", "50 kg · 3×10"]

      - header: "UNILATERAL + ESTABILIDAD · empezá por izquierda"
        header_e: "UNILATERAL POSTERIOR"
        ejercicios:
          - nombre: "Split squat (pie atrás en piso)"
            nota: "rodilla al dedo gordo"
            semanas: ["12,5 kg · 2×8/pierna", "12,5 kg · 3×8", "15 kg · 3×8", "12,5 kg · 2×8"]
          - nombre: "RDL a una pierna"
            nota: "glúteo medio"
            mover_a_e: true
            semanas: ["2×12,5 kg · 2×8/pierna", "2×12,5 kg · 3×8", "2×15 kg · 3×8", "2×12,5 kg · 2×8"]
          - nombre: "Curl femoral"
            nota: "control"
            semanas: ["3×8-10", "3×10", "3×10-12", "3×8"]

      - header: "CORE"
        mover_a_e: true
        header_e: "CORE"
        items:
          - "Plancha frontal — 3×30s"
          - "Plancha lateral — 3×20s/lado"
          - "Pallof press en polea — 2×10/lado"

  # ─────────────────────────────────────────────────────────────
  B:
    titulo: "DÍA B"
    subtitulo: "UPPER · Hombro-safe + brazos"
    duracion: "~75-80 min"
    duracion_5: "~55 min"
    secciones:
      - header: "CALENTAMIENTO + HOMBRO"
        items:
          - "Bici o remo suave — 3 min"
          - "Reverse fly inclinado (mancuernas livianas) — 2×20"
          - "Rotación externa con banda a 0° (toalla bajo el codo) — 2×15/lado · tensión baja"
          - "Face pull con banda — 2×20 · tensión baja-moderada"
          - "Band pull-apart (palmas arriba) — 2×15 · tensión baja-moderada"
          - "Serrato punch con banda — 2×12 · tensión baja"
          - "Prone IYT — 2×5 c/letra · sin peso"

      - header: "TRACCIÓN VERTICAL"
        ejercicios:
          - nombre: "Chin-ups / dominadas estrictas"
            nota: "2s bajando · RPE 7-8"
            semanas: ["4×6", "4×7", "4×8 (o +peso)", "3×6 (deload)"]

      - header: "EMPUJE DE PECHO + ESPALDA"
        ejercicios:
          - nombre: "Cruce bajo en polea (unilateral)"
            semanas: ["10-12,5 kg · 3×12-15", "12,5 kg · 3×12", "15 kg · 3×10-12", "12,5 kg · 3×12"]
          - nombre: "Push-ups"
            semanas: ["3×12", "3×15", "Pies elevados · 3×12", "3×12"]
          - nombre: "Remo en máquina / mancuerna"
            nota: "sin encoger hombro"
            semanas: ["3×10-12", "3×12", "+carga · 3×10", "3×10"]

      - header: "BRAZOS"
        mover_a_e: true
        header_e: "BRAZOS"
        ejercicios:
          - nombre: "Curl bíceps barra W"
            semanas: ["5-6 kg/lado · 3×10-12", "6 kg · 3×12", "7 kg · 3×10-12", "6 kg · 3×10"]
          - nombre: "Curl martillo"
            semanas: ["8 kg · 3×12", "9 kg · 3×12", "10 kg · 3×10-12", "8 kg · 3×12"]
          - nombre: "Tríceps pushdown (polea)"
            semanas: ["25-27,5 kg · 3×12-15", "27,5 kg · 3×12", "30 kg · 3×10-12", "27,5 kg · 3×12"]
          - nombre: "Tríceps tras nuca (polea)"
            semanas: ["15 kg · 2×12", "15 kg · 3×12", "17,5 kg · 3×12", "15 kg · 2×12"]

      # Se QUEDA en el Día B aunque se entrene 5 días: es trabajo de manguito
      # rotador (salud del hombro), no accesorio de volumen.
      - header: "CORE / HOMBRO"
        items:
          - "Pallof press en polea — 2×10/lado"
          - "Plancha lateral — 2×20s/lado"
          - "Rotación externa en polea — 1×20/lado · liviano (manguito)"

  # ─────────────────────────────────────────────────────────────
  C:
    titulo: "DÍA C"
    subtitulo: "ZONA 2 · Aeróbico (bici · RPM crucero 38)"
    duracion: "~45-55 min"
    secciones:
      - header: "CALENTAMIENTO"
        items:
          - "Bici muy suave (progresivo) — 8 min (últimos 2 min: 3-4 aceleraciones 10s)"

      - header: "ZONA 2 · EMOM"
        ejercicios:
          - nombre: "Formato"
            semanas: ["EMOM 20 min", "EMOM 24 min", "EMOM 20 min", "EMOM 16 min (descarga)"]
          - nombre: "Trabajo / descanso"
            semanas: ["50s / 10s", "50s / 10s", "55s / 5s", "45s / 15s"]
          - nombre: "Intensidad"
            semanas: ["38 RPM", "38 RPM", "38 RPM", "38 RPM (suave)"]

      - header: "REGLAS"
        items:
          - "Min impares: pedaleo a RPM crucero (38) + transición"
          - "Min pares: muy suave (remover lactato) + descanso"
          - "RPM parejo (38) · exhalar largo en recuperación · piernas NO deben quemar"

      - header: "CIERRE"
        items:
          - "Vuelta a la calma — 5 min · movilidad cadera/tobillo"

  # ─────────────────────────────────────────────────────────────
  D:
    titulo: "DÍA D"
    subtitulo: "LOWER · Sentadilla + step-up lateral"
    duracion: "~75 min"
    duracion_5: "~55-60 min"
    secciones:
      - header: "CALENTAMIENTO"
        items:
          - "Bici suave — 3 min"
          - "Abducción cadera acostado de lado con banda (tobillos) — 2×15/lado · tensión baja"
          - "Glute bridge con banda sobre rodillas (empujá rodillas afuera) — 2×12 · pausa 1s · tensión baja-moderada"
          - "Caminata lateral / monster walk con banda — 2×10 pasos/lado · empezá por izq · tensión baja-moderada"
          - "TKE con banda — 2×15/lado · tensión baja-moderada"
          - "Sentadilla al aire — 2×10 · rango sin dolor"

      - header: "ISOMETRÍA"
        ejercicios:
          - nombre: "Wall sit (~60°)"
            nota: "desc 60s"
            semanas: ["3×45s", "3×50s", "3×55s", "3×40s"]

      - header: "FUERZA · patrón sentadilla"
        ejercicios:
          - nombre: "Front squat (goblet o barra)"
            nota: "2s bajando · RPE 6-7"
            semanas: ["40-42,5 kg · 3×10", "45 kg · 3×10", "47,5 kg · 3×8-10", "40 kg · 3×10"]
          - nombre: "Curl femoral unilateral en máquina"
            nota: "empezá por izq"
            semanas: ["3×8-10/pierna", "3×10", "3×10-12", "3×8"]

      - header: "ESTABILIDAD + GLÚTEO MEDIO · foco rodilla izq"
        ejercicios:
          - nombre: "Step-up lateral (cajón 20-25 cm · db)"
            nota: "empezá por izq · bajá 2-3s"
            semanas: ["10 kg · DER 3×10 / IZQ 4×10", "10 kg · 3×10 ambas *", "12,5 kg · 3×10", "10 kg · 2×10"]
          - nombre: "Hip thrust"
            nota: "igualar Día A"
            semanas: ["60 kg · 3×12", "62,5 kg · 3×12", "65 kg · 3×10-12", "60 kg · 3×10"]

      - header: "CORE"
        mover_a_e: true
        header_e: "CORE"
        items:
          - "Plancha frontal — 3×30s"
          - "Plancha lateral — 3×20s/lado"

      - header: "NOTA STEP-UP"
        items:
          - "* Step-up S2: pasar a 3×10 en ambas piernas SOLO cuando la izquierda iguale a la derecha; si aún cuesta, seguí con la serie extra en izq."

  # ─────────────────────────────────────────────────────────────
  # DÍA E — solo existe en la variante de 5 días.
  # Aporta su propio calentamiento; el resto de las secciones se INYECTAN
  # desde A, B y D (las marcadas con `mover_a_e: true`).
  E:
    titulo: "DÍA E"
    subtitulo: "ACCESORIOS · Unilateral posterior + brazos + core"
    duracion: "~50-55 min"
    solo_en_variante: 5
    orden_secciones: ["CALENTAMIENTO", "UNILATERAL POSTERIOR", "BRAZOS", "CORE"]
    secciones:
      - header: "CALENTAMIENTO"
        items:
          - "Bici suave — 4 min"
          - "Abducción cadera acostado de lado con banda (tobillos) — 2×15/lado · tensión baja"
          - "Band pull-apart (palmas arriba) — 2×15 · tensión baja-moderada"
          - "Rotación externa con banda a 0° (toalla bajo el codo) — 2×15/lado · tensión baja"
          - "Dead bug — 2×10/lado"

  # ─────────────────────────────────────────────────────────────
  # DÍA AD — solo existe en la variante de 3 días.
  # Fusiona los dos lower (A y D) en una sola sesión que cubre bisagra +
  # sentadilla. NO repite cargas: las referencia desde A y D, así que si
  # cambiás un peso allá arriba, acá se actualiza solo.
  #
  # Criterios de la fusión:
  #   · Wall sit: se usa el de A (5×40s); el de D no se suma.
  #   · Hip thrust: aparece 1 sola vez (viene con la bisagra del Día A).
  #   · Split squat: NO entra — pisa el mismo patrón que el step-up lateral
  #     y sacarlo baja la sesión de ~100 a ~87 min.
  #   · Curl femoral: se usa el UNILATERAL de D (sirve más para emparejar
  #     la pierna izquierda que el bilateral de A).
  AD:
    titulo: "DÍA A"
    subtitulo: "LOWER completo · bisagra + sentadilla"
    duracion: "~85-90 min"
    solo_en_variante: 3
    componer:
      - dia: A
        seccion: "CALENTAMIENTO"
        agregar_items:
          - "Sentadilla al aire — 2×10 · rango sin dolor"

      - dia: A
        seccion: "ISOMETRÍA · tendón rotuliano"

      - dia: A
        seccion: "FUERZA · bisagra de cadera"

      - dia: D
        seccion: "FUERZA · patrón sentadilla"
        excluir: ["Curl femoral unilateral en máquina"]

      - header: "ESTABILIDAD · foco rodilla izq"
        tomar:
          - {dia: D, ejercicio: "Step-up lateral (cajón 20-25 cm · db)"}
          - {dia: A, ejercicio: "RDL a una pierna"}
          - {dia: D, ejercicio: "Curl femoral unilateral en máquina"}

      - dia: A
        seccion: "CORE"

      - dia: D
        seccion: "NOTA STEP-UP"

# ═══════════════════════════════════════════════════════════════
# VARIANTES — qué días salen según cuántos se entrene por semana
# ═══════════════════════════════════════════════════════════════
variantes:
  3:
    dias: [AD, B, C]
    descripcion: "Lower completo · Upper · Zona 2"
  4:
    dias: [A, B, C, D]
    descripcion: "Lower bisagra · Upper · Zona 2 · Lower sentadilla"
  5:
    dias: [A, B, C, D, E]
    aplicar_mover_a_e: true
    descripcion: "Sesiones cortas (~55 min) + día de accesorios"

variante_default: 4
