# Progresiones de Musculación y Levantamiento
# Transcripción exacta de Musculación_y_levantamiento.xlsx
#
# Columnas del Excel:
#   - Fuerza Base (Sentadillas y Peso Muerto) → usa % RM
#   - Skill C&J (Corrección de Metida y Jerk) → protocolo técnico
#   - Accesorios (Búlgaras, Hip Thrust, Step-ups) → RPE
#
# Estímulo C&J 2×/semana (Agosto):
#   - skill_cj         → sesión PESADA (día que absorbe el C&J: 5→E, 4→B, 3→A)
#   - skill_cj_ligero  → 2º toque TÉCNICO ligero (Día D · Aeróbico/Pacing)
#                        vacío = sin 2º toque esa semana (S4 descarga, S8 post-testeo)

# Ejercicios que usan % RM para Fuerza Base:
#   - Front Squat (Día 1)
#   - Sumo Deadlift (Día 3)
#   - Back Squat Cuádriceps (Día 3)

semanas:
  S1:
    fase: "Adaptación a Carga"
    fuerza_base:
      series: 4
      reps: 5
      porcentaje_rm: 75
      descripcion: "4 series x 5 reps al 75% RM"
    skill_cj: "4 rondas: 2 Clean Pulls pausa rodilla + 2 Tall Cleans · desc 90s · 32,5-35 kg (~60%) · RPE 6"
    skill_cj_ligero: "2 rondas Tall Cleans · 25 kg (~45%) · RPE 4 · técnica pura"
    accesorios:
      series: 3
      reps: 8
      intensidad: "RPE 7"
      descripcion: "3 series x 8 reps (RPE 7)"

  S2:
    fase: "Intensificación 1"
    fuerza_base:
      series: 4
      reps: 4
      porcentaje_rm: 78
      descripcion: "4 series x 4 reps al 78% RM"
    skill_cj: "4 rondas: 2 High Hang Squat Cleans + 2 Jerk Balance · desc 90s · 35-38 kg (~65-70%) · RPE 7"
    skill_cj_ligero: "2 rondas Tall Cleans · 25 kg (~45%) · RPE 4 · técnica pura"
    accesorios:
      series: 3
      reps: 8
      intensidad: "RPE 8"
      descripcion: "3 series x 8 reps (Subir peso - RPE 8)"

  S3:
    fase: "Intensificación 2"
    fuerza_base:
      series: 4
      reps: 4
      porcentaje_rm: 82
      descripcion: "4 series x 4 reps al 82% RM"
    skill_cj: "4 rondas: 1 Segment Clean (pausa 2\") + 1 Pause Dip Split Jerk · desc 2 min · 40-42,5 kg (~73-77%) · RPE 7,5"
    skill_cj_ligero: "2 rondas Tall Cleans · 27,5 kg (~50%) · RPE 4 · técnica pura"
    accesorios:
      series: 3
      reps: 6
      intensidad: "RPE 8-9"
      descripcion: "3 series x 6 reps (Carga alta - RPE 8-9)"

  S4:
    fase: "Descarga Técnica"
    fuerza_base:
      series: 3
      reps: 3
      porcentaje_rm: 60
      descripcion: "3 series x 3 reps al 60% RM"
    skill_cj: "Descarga técnica — A: 5 Clean Pulls rodilla + 5 Tall Cleans (3 rondas · 90s) · B: 2 Pause Cleans 2\" (3 rondas · 2 min) · RPE 5"
    skill_cj_ligero: ""   # descarga — sin 2º toque
    accesorios:
      series: 2
      reps: 8
      intensidad: "RPE 6"
      descripcion: "2 series x 8 reps livianas (RPE 6)"

  S5:
    fase: "Fuerza Máxima 1"
    fuerza_base:
      series: 3
      reps: 3
      porcentaje_rm: 85
      descripcion: "3 series x 3 reps al 85% RM"
    skill_cj: "5 rondas: 1 High Hang Clean + 1 Clean desde piso + 1 Split Jerk · desc 2 min · 42,5-45 kg (~77-82%) · RPE 8"
    skill_cj_ligero: "2 rondas Tall Cleans · 30 kg (~55%) · RPE 4 · técnica pura"
    accesorios:
      series: 3
      reps: 6
      intensidad: "pesadas"
      descripcion: "3 series x 6 reps pesadas"

  S6:
    fase: "Fuerza Máxima 2"
    fuerza_base:
      series: 3
      reps: 3
      porcentaje_rm: 88
      descripcion: "3 series x 3 reps al 88% RM"
    skill_cj: "EMOM 8': min impar 1 C&J completo · min par rest · 45-47,5 kg (~82-86%) · RPE 8,5"
    skill_cj_ligero: "2 rondas técnica pura · 32,5 kg (~60%) · RPE 4"
    accesorios:
      series: 3
      reps: 6
      intensidad: "pesadas"
      descripcion: "3 series x 6 reps pesadas"

  S7:
    fase: "Pico de Fuerza"
    fuerza_base:
      series: 3
      reps: 2
      porcentaje_rm: 90
      descripcion: "3 series x 2 reps al 90% RM"
    skill_cj: "5 rondas: 1 Clean pausa 2\" recepción + 1 Split Jerk · desc 2-3 min · 47,5-50 kg (~86-91%) · RPE 9"
    skill_cj_ligero: "2 rondas técnica pura · 30 kg (~55%) · RPE 4"
    accesorios:
      series: 2
      reps: 0
      intensidad: "bajar volumen"
      descripcion: "Bajar a 2 series de accesorios"

  S8:
    fase: "TOMA DE MARCAS"
    fuerza_base:
      series: 0
      reps: 0
      porcentaje_rm: 100
      descripcion: "¡Testeo de 1 RM Absoluto!"
    skill_cj: "Testeo 1RM C&J — piramidal: 50%(3) 60%(2) 70%(1) 80%(1) 85%(1) 90%(1) 95%(1) 100%+ · RPE 10"
    skill_cj_ligero: ""   # post-testeo — sin 2º toque
    accesorios:
      series: 0
      reps: 0
      intensidad: "ninguna"
      descripcion: "No se realizan accesorios pesados"
