# ═══════════════════════════════════════════════════════════
# SELECCIÓN POR TIPO DE DÍA
#
# formato: "rounds" o "tabata"
#   - rounds: "3 Rounds" + ejercicios con reps
#   - tabata: "Tabata XX\" x YY\"" + ejercicios (sin reps, se hacen por tiempo)
#
# header: "CORE" o "ESTABILIDAD" (para el título de la sección)
# ═══════════════════════════════════════════════════════════
seleccion_por_dia:
  dia_a_tren_inferior_t2b:
    categorias: ["anti_rotacion", "anti_extension"]
    cantidad: 2
    formato: "rounds"
    rondas: 3
    header: "CORE"
    intensidad_max: "media-alta"
    nota: "Evitar flexión pesada, T2B ya trabaja flexión de cadera"

  dia_b_gimnasia_c2b:
    categorias: ["flexion_dinamica", "anti_extension", "anti_rotacion"]
    cantidad: 3
    formato: "rounds"
    rondas: 3
    header: "CORE"
    intensidad_max: "alta"
    nota: "Pulling es plano diferente, combina bien con flexión"

  dia_c_fuerza_absoluta:
    categorias: ["anti_extension", "anti_rotacion"]
    cantidad: 2
    formato: "rounds"
    rondas: 3
    header: "CORE"
    intensidad_max: "media"
    nota: "Proteger columna, evitar carga axial extra"

  dia_d_capacidad_aerobica:
    categorias: ["carries"]
    cantidad: 2
    formato: "rounds"
    rondas: 3
    header: "ESTABILIDAD"
    intensidad_max: "alta"
    nota: "Estabilidad bajo fatiga y movimiento"

  dia_e_recuperacion_skills:
    categorias: ["complementarios"]
    cantidad: 2
    formato: "tabata"
    tabata_trabajo: "25\""
    tabata_descanso: "10\""
    header: "CORE"
    intensidad_max: "media"
    nota: "No fatigar para olímpicos, activar estabilidad"
